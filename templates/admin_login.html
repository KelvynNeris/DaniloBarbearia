<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login do Administrador — Danilo Barbearia</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      margin-top: 0.5rem;
    }

    .auth-card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2.75rem 2.25rem 2.25rem;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-strong) 100%);
    }

    .auth-card h1 {
      font-size: 1.45rem;
      margin: 0 0 0.4rem;
      color: var(--text);
      text-align: center;
      font-weight: 700;
    }

    .auth-card .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2.25rem;
      display: block;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .form-group input {
      width: 100%;
      padding: 0.82rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
      box-sizing: border-box;
      min-height: 48px;
      appearance: none;
      -webkit-appearance: none;
    }

    .form-group input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--panel);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .form-actions {
      display: flex;
      gap: 0.85rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      align-items: center;
    }

    .form-actions .btn {
      flex: 1;
      min-height: 46px;
    }

    .flash-messages {
      margin: 1rem 0;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2.25rem 1.5rem 1.75rem;
      }

      .auth-card h1 {
        font-size: 1.3rem;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">Danilo<span>Barbearia</span></a>
      <nav class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">🌙</button>
        <a class="btn" href="/">← Voltar</a>
      </nav>
    </div>
  </header>

  {# flash messages #}
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="container flash-messages">
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <div class="icon-badge">🔐</div>
        <h1>Acesso Admin</h1>
        <span class="subtitle">Informe suas credenciais para continuar</span>

        <form method="post" action="/admin/login" id="adminLoginForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

          <div class="form-group">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" required maxlength="150" placeholder="Digite seu usuário" autofocus>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required minlength="1" placeholder="Digite sua senha">
          </div>

          <div class="form-actions">
            <a class="btn" href="/">Cancelar</a>
            <button type="submit" class="btn primary">Entrar →</button>
          </div>
        </form>
        <p style="text-align:center;margin-top:1.25rem;margin-bottom:0">
          <a href="/admin/recuperar" style="color:var(--muted);font-size:0.88rem;text-decoration:underline">Esqueceu a senha?</a>
        </p>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
