<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro de Administrador — Barbearia</title>
  <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Cadastro de Administrador</h1>
      <a href="/" class="btn-link">Voltar</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <form method="post" action="/admin/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field-row">
          <label for="username">Nome de usuário (login)</label>
          <input id="username" name="username" required maxlength="150" placeholder="ex: admin@barbearia.com">
        </div>
        <div class="field-row">
          <label for="name">Nome completo</label>
          <input id="name" name="name" required maxlength="255" placeholder="Seu nome completo">
        </div>
        <div class="field-row">
          <label for="phone">Telefone (opcional)</label>
          <input id="phone" name="phone" type="tel" maxlength="20" placeholder="(00) 00000-0000">
        </div>
        <div class="field-row">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required minlength="6" placeholder="Senha segura">
        </div>
        <div class="field-row">
          <label for="password2">Confirme a senha</label>
          <input id="password2" name="password2" type="password" required minlength="6" placeholder="Repita a senha">
        </div>
        <div class="actions">
          <button type="submit" class="btn">Registrar administrador</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
